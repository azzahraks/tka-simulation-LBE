<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulasi TKA Bahasa Inggris SMA 2026</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --navy:#12334a; --teal:#1d9a9a; --mint:#eaf7f6; --bg:#f5f7f9;
  --text:#24323d; --muted:#6d7b85; --border:#dfe7eb; --white:#fff;
  --danger:#b63b45; --green:#1f8a62;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
.hidden{display:none!important}
.topbar{background:var(--navy);color:white;padding:15px 24px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}
.topbar-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-weight:800;letter-spacing:.3px}.brand small{display:block;font-weight:500;opacity:.75;margin-top:3px}
.timer{background:#ffffff18;border:1px solid #ffffff30;border-radius:12px;padding:8px 14px;text-align:center;min-width:130px}
.timer-label{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:1px}.timer-value{font-size:22px;font-weight:800}
.wrap{max-width:1180px;margin:30px auto;padding:0 18px}
.card{background:white;border:1px solid var(--border);border-radius:18px;box-shadow:0 6px 24px #16334a0a}
.hero{padding:38px}.hero h1{margin:0 0 8px;font-size:30px;color:var(--navy)}.hero p{color:var(--muted);line-height:1.6}
.badge{display:inline-block;background:var(--mint);color:var(--teal);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:25px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;outline:none;background:white}
.field input:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #1d9a9a18}
.full{grid-column:1/-1}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}
.btn-primary{background:var(--teal);color:white}.btn-secondary{background:#edf2f4;color:var(--navy)}
.btn-danger{background:#fff0f1;color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.exam-layout{display:grid;grid-template-columns:1fr 270px;gap:18px}
.question-card{padding:28px;margin-bottom:18px}
.q-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.q-number{font-size:13px;color:var(--teal);font-weight:900}.q-type{font-size:11px;color:var(--muted);background:#f0f4f5;padding:6px 9px;border-radius:7px}
.question{font-size:17px;line-height:1.65;font-weight:700;margin:14px 0 16px}
.passage{background:#f8fafb;border-left:4px solid var(--teal);padding:15px 17px;border-radius:8px;line-height:1.65;font-size:14px;margin-bottom:20px;white-space:pre-line}
.options{display:grid;gap:9px}
.option{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.option:hover{background:#fafcfc;border-color:#b8d9d8}
.option input{margin-top:4px;accent-color:var(--teal)}
.category{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}.category th,.category td{border:1px solid var(--border);padding:10px;text-align:center}.category th:first-child,.category td:first-child{text-align:left}.category th{background:#eef7f6;color:var(--navy)}
.sidebar{position:sticky;top:90px;height:max-content;padding:18px}
.sidebar h3{margin:0 0 12px;color:var(--navy)}
.gridnums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.num{border:1px solid var(--border);background:white;border-radius:8px;padding:8px 0;text-align:center;cursor:pointer;font-size:12px;font-weight:800}.num.done{background:var(--mint);border-color:#a9dcd9;color:var(--teal)}.num.current{outline:2px solid var(--teal)}
.progress{height:7px;background:#e9eef0;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--teal);width:0}
.footer{padding:20px;text-align:center;color:#8a969d;font-size:12px}
.result-hero{padding:35px;text-align:center}.score{font-size:54px;font-weight:900;color:var(--teal)}.result-table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}.result-table th,.result-table td{border:1px solid var(--border);padding:9px;text-align:left}.result-table th{background:#f1f6f7}
.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0003;z-index:50}
.warning{color:var(--danger);font-weight:800}
@media(max-width:850px){.exam-layout{grid-template-columns:1fr}.sidebar{position:static;order:-1}.form-grid{grid-template-columns:1fr}.hero{padding:25px}.topbar-inner{align-items:flex-start}.timer{min-width:110px}}

.section-tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px;padding-bottom:3px}
.section-tab{border:1px solid var(--border);background:white;border-radius:10px;padding:9px 12px;color:var(--navy);font-weight:800;cursor:pointer;white-space:nowrap}
.section-tab small{display:block;color:var(--muted);font-weight:600;font-size:10px;margin-top:2px}
.section-tab.active{background:var(--teal);color:white;border-color:var(--teal)}
.section-tab.active small{color:#e5ffff}
.section-material{padding:0;margin-bottom:18px;overflow:hidden}
.material-head{padding:24px 27px 16px}.material-head>span{font-size:10px;font-weight:900;letter-spacing:1.2px;color:var(--teal)}
.material-head h2{margin:5px 0;color:var(--navy);font-size:23px}.material-head p{margin:0;color:var(--muted);font-size:13px}
.reading-text{margin:0 27px 24px;background:#f8fafb;border-left:4px solid var(--teal);padding:20px;white-space:pre-line;line-height:1.75;font-size:14px}
.study-image{display:block;max-width:min(507px,calc(100% - 54px));margin:0 auto 28px;border-radius:10px;border:1px solid var(--border)}
.data-table-title{font-weight:800;color:var(--navy);padding:0 27px 10px}
.data-table,.answer-table{width:calc(100% - 54px);margin:0 27px 27px;border-collapse:collapse;font-size:13px}
.data-table th,.data-table td,.answer-table th,.answer-table td{border:1px solid var(--border);padding:10px 12px}
.data-table th,.answer-table th{background:#eef7f6;color:var(--navy);font-weight:800}
.data-table td:last-child{text-align:center;font-weight:800}
.answer-table td:not(:first-child),.answer-table th:not(:first-child){text-align:center}
.table-wrap{overflow-x:auto}
.table-choice input{accent-color:var(--teal);transform:scale(1.1)}
.table-choice{cursor:pointer}
.q-mini{font-size:11px;color:var(--muted);background:#f0f4f5;display:inline-block;padding:5px 8px;border-radius:7px;margin-top:5px}
.flag-btn{border:1px solid var(--border);background:#fff7e8;color:#a16b08;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer;white-space:nowrap}
.flag-btn.flagged{background:#fff0c7;border-color:#e2b74d}
.option{position:relative}
.option.selected{border-color:#8ccfca;background:#f4fbfa}
.letter{font-weight:900;min-width:18px;color:var(--navy)}
.option input{margin-top:4px}
.question-state{font-size:11px;margin-top:13px;color:var(--muted)}
.question-state.answered{color:var(--green);font-weight:800}
.flag-note{color:#a16b08;margin-left:5px}
.status-count{display:grid;gap:6px;font-size:10px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;border:1px solid #b8c4c9}
.dot.unanswered{background:white}.dot.answered{background:var(--mint);border-color:#8acdc7}.dot.flagged{background:#ffe3a0;border-color:#d4a83e}
.num.flagged{background:#fff0c7;border-color:#e2b74d;color:#8a650c}
.num.done{background:var(--mint);border-color:#a9dcd9;color:var(--teal)}
.num.done.flagged{background:#fff0c7;border-color:#e2b74d;color:#8a650c}
.section-actions{display:flex;justify-content:space-between;gap:10px;margin:10px 0 30px}
@media(max-width:850px){.section-actions{flex-direction:column}.section-actions .btn{width:100%}.data-table,.answer-table{width:calc(100% - 28px);margin-left:14px;margin-right:14px}.reading-text{margin-left:14px;margin-right:14px}.material-head{padding-left:18px;padding-right:18px}.study-image{max-width:calc(100% - 28px)}}

/* ===== Responsive/mobile refinement ===== */
html{scroll-behavior:smooth}
body{overflow-x:hidden}
.result-name{font-size:26px;font-weight:900;color:var(--navy);margin:8px 0 18px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px;margin:22px auto 0}
.result-stat{border:1px solid var(--border);border-radius:14px;padding:15px 12px;background:#fff;text-align:center}
.result-stat strong{display:block;font-size:25px;line-height:1.1;margin-bottom:5px}
.result-stat span{font-size:12px;color:var(--muted);font-weight:700}
.result-stat.correct strong{color:var(--green)}
.result-stat.wrong strong{color:var(--danger)}
.result-stat.blank strong{color:#8a650c}
.result-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.result-table{min-width:760px}
.result-table .answer-cell{vertical-align:top;line-height:1.45}
.answer-main{font-weight:700}
.answer-correct{margin-top:5px;color:var(--green);font-size:12px;font-weight:700}
.answer-correct strong{color:var(--navy)}
.status-badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}
.status-badge.correct{background:#eaf7f1;color:var(--green)}
.status-badge.wrong{background:#fff0f1;color:var(--danger)}
.status-badge.blank{background:#fff7e8;color:#8a650c}
.submit-bottom{margin-top:18px;padding:18px;border:1px solid var(--border);border-radius:14px;background:#fff}
.submit-bottom .btn{min-width:220px}
@media(max-width:850px){
  .topbar{padding:10px 14px}.topbar-inner{gap:10px}.brand{font-size:15px}.brand small{font-size:10px}
  .timer{min-width:92px;padding:6px 9px}.timer-label{font-size:8px}.timer-value{font-size:18px}
  .wrap{margin:14px auto;padding:0 10px}.hero{padding:22px 17px}.hero h1{font-size:27px}
  .exam-layout{display:flex;flex-direction:column}.sidebar{order:-1;padding:13px;position:static}
  .sidebar h3{font-size:17px}.gridnums{grid-template-columns:repeat(5,1fr);gap:5px}.num{min-height:38px;padding:7px 0}
  .section-tabs{margin:0 -2px 10px;padding-bottom:4px}.section-tab{padding:8px 10px;font-size:12px}
  .section-material{border-radius:14px}.material-head{padding:18px 15px 12px}.material-head h2{font-size:20px}
  .reading-text{margin:0 10px 18px;padding:15px;font-size:14px;line-height:1.7}
  .study-image{max-width:calc(100% - 20px);margin-bottom:18px}
  .question-card{padding:18px 14px;margin-bottom:12px;border-radius:14px}.q-head{gap:8px}.question{font-size:16px;line-height:1.55}
  .option{padding:11px 10px;font-size:14px}.answer-table{width:calc(100% - 20px);margin-left:10px;margin-right:10px;font-size:12px}.answer-table th,.answer-table td{padding:9px 7px}
  .section-actions{gap:8px;margin:8px 0 20px}.section-actions .btn{width:100%}
  .result-hero{padding:24px 15px}.score{font-size:48px}.result-name{font-size:23px}.result-stats{grid-template-columns:1fr;max-width:330px}.result-stat{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:12px 15px}.result-stat strong{margin:0;font-size:22px;order:2}.result-stat span{order:1}
  .submit-bottom .btn{width:100%;min-width:0}
}
@media(min-width:851px){.sidebar{max-height:calc(100vh - 110px);overflow:auto}}


/* ===== V8 registration / admin-safe student UI ===== */
.auto-code-field input{background:#eef4f8;border-color:#c9d8e1;color:#36566b;font-weight:900;letter-spacing:.7px;cursor:not-allowed}
.session-open{background:#edf5ff!important;color:#2469c7!important;border-color:#9fc4f3!important}
.session-closed{background:#fff0f1!important;color:#b63b45!important;border-color:#efb3ba!important}


.result-card{padding:34px}
.result-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:1px solid var(--border);padding-bottom:24px}
.result-head h1{margin:6px 0 5px;color:var(--navy);font-size:30px}
.result-head p{margin:0;color:var(--muted)}
.result-score{font-size:42px;font-weight:900;color:var(--teal);white-space:nowrap}
.result-score small{font-size:16px;color:var(--muted);font-weight:700}
.result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.result-stat{border:1px solid var(--border);border-radius:12px;padding:18px;background:#f8fbfc;text-align:center}
.result-stat strong{display:block;font-size:28px;color:var(--navy)}
.result-stat span{font-size:13px;color:var(--muted)}
.result-stat.correct strong{color:var(--green)}
.result-stat.wrong strong{color:var(--danger)}
.result-stat.blank strong{color:#7b8790}
.result-note{padding:13px 15px;border-radius:10px;background:var(--mint);color:var(--navy);font-weight:600}
.result-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
.result-table{width:100%;border-collapse:collapse;min-width:850px}
.result-table th,.result-table td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.result-table th{background:var(--mint);color:var(--navy)}
.result-table tbody tr.result-correct td{background:#eef7ff}.result-table tbody tr.result-correct td:nth-child(3){color:#1769aa;font-weight:800}.result-table tbody tr.result-wrong td{background:#fff0f1}.result-table tbody tr.result-wrong td:nth-child(3){color:#c62828;font-weight:800}.result-table tbody tr.result-blank td{background:#fafbfc}
.status-pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}

.status-pill.bad{background:#fff0f1;color:var(--danger)}
.status-pill.empty{background:#f0f2f4;color:#66737c}
@media(max-width:700px){
 .result-card{padding:22px}
 .result-head{display:block}
 .result-score{margin-top:15px;font-size:34px}

}

/* ===== V20 additions: floating reading text + thank-you page ===== */
.exam-tools{position:relative;top:auto;z-index:19;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 12px;background:#eef7f6;border:1px solid #cfe7e5;border-top:0;border-radius:0 0 14px 14px;box-shadow:0 5px 14px #16334a12;margin:0 auto 12px;width:min(1180px,calc(100% - 36px))}
.exam-tools-question{display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border-radius:0 0 9px 9px;padding:8px 13px;font-size:12px;font-weight:900;letter-spacing:.2px}
.exam-tools-text{border:0;border-radius:0 0 9px 9px;background:var(--navy);color:#fff;padding:8px 13px;font-weight:900;font-size:12px;cursor:pointer;box-shadow:none}
.exam-tools-text:hover{background:#1d566f}
.text-float-btn{display:none!important}
.text-overlay{position:fixed;inset:0;background:#102a3acc;z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.text-overlay.open{display:flex}
.text-modal{background:#fff;width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:18px;box-shadow:0 20px 60px #0005;position:relative}
.text-modal-close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;z-index:3;border:0;border-radius:999px;background:#eef2f4;color:var(--navy);font-weight:900;width:38px;height:38px;cursor:pointer}
.text-modal .section-material{box-shadow:none;border:0;margin:0}
.thank-card{padding:48px 28px;text-align:center;max-width:760px;margin:40px auto}
.thank-card h1{color:var(--navy);font-size:34px;margin:10px 0}
.thank-card .thank-message{font-size:18px;line-height:1.7;color:var(--muted);max-width:620px;margin:0 auto 22px}
.thank-score{font-size:46px;font-weight:900;color:var(--teal);margin:12px 0}
.thank-quote{background:#f7fbfb;border:1px solid var(--border);border-radius:14px;padding:18px 20px;color:var(--navy);font-weight:800;line-height:1.6;margin:24px auto;max-width:600px}

/* Navigation / floating tools */
.exam-tools-question{cursor:pointer;}
.exam-tools-text{background:#f3a33a !important;color:#fff !important;border:1px solid #df8e20 !important;}
.question-nav-panel{display:none;position:fixed;top:68px;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 20px));z-index:75;background:#fff;border:1px solid #dbe3e6;border-radius:0 0 14px 14px;box-shadow:0 8px 24px rgba(0,0,0,.14);}
.question-nav-panel.open{display:block;}
.question-nav-inner{position:relative;padding:12px 14px 14px;max-width:1200px;margin:auto;}
.question-nav-title{font-weight:900;color:var(--navy);font-size:14px;margin-bottom:8px;padding-right:42px;}
.question-nav-close{position:absolute;right:10px;top:9px;width:34px;height:34px;border:1px solid #d9e0e3;border-radius:50%;background:#f7f9fa;color:var(--navy);font-weight:900;font-size:18px;line-height:1;cursor:pointer;}
.question-nav-status{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#68757c;margin-bottom:8px;}
.question-nav-counts{font-size:13px;color:#4d5c65;margin:4px 0 9px;}
.question-nav-grid{display:grid;grid-template-columns:repeat(10,minmax(28px,1fr));gap:6px;max-height:220px;overflow:auto;padding:2px;}
.question-nav-grid .nav-num{min-height:34px;border:1px solid #d9e0e3;background:#f7f9fa;border-radius:8px;font-weight:800;color:#52616a;cursor:pointer;}
.question-nav-grid .nav-num.done{background:#e5f3f2;color:#287d7b;border-color:#9bcac7;}
.question-nav-grid .nav-num.flagged{background:#fff4dc;color:#a87918;border-color:#e3c477;}
.question-nav-grid .nav-num.current{outline:2px solid #284e63;outline-offset:1px;}
.question-nav-submit-wrap{margin-top:10px;}
.question-nav-submit{width:100%;}
.floating-exam-tools{position:fixed;top:74px;right:12px;z-index:70;display:none;gap:7px;align-items:center;}
.floating-exam-tools.show{display:flex;}

{n:1,type:"MC",passage:`The Lion and the Mouse

Once upon a time, in a thick jungle in Africa, there lived a strong and fierce lion. Every afternoon, the lion would rest under the cool shade of a big tree after walking through the forest.

One day, while he was sleeping, a playful little mouse passed by. The mouse saw the lion's thick mane and was curious. He climbed up and began to jump around on the lion's head, playing in his mane.

The lion woke up suddenly and was not happy at all. He quickly caught the mouse in his big paw and roared, "Who dares to wake me up?" He was very angry and almost killed the mouse.

Scared and shaking, the mouse begged the lion, "Please don't kill me! I didn't mean to bother you. If you let me go, I promise I'll help you one day."

The lion laughed loudly. "You? Help me? That's funny." But the lion was feeling kind, so he let the mouse go free.

A few days later, the lion was walking through the jungle again when he fell into a trap. A net set by hunters caught him, and he couldn't escape. He tried to bite and tear the ropes, but they were too strong. The lion roared loudly, hoping someone would come.

The mouse heard the roar and ran to help. He saw the lion trapped and quickly started to chew the ropes with his sharp teeth. After some time, the net broke, and the lion was free.

The lion looked at the mouse with surprise and said, "Thank you! You really saved my life."

The mouse smiled and said, "I told you I would help you one day."

From that moment on, the lion and the mouse became close friends. The lion learned that even small creatures can do great things, and we all need help sometimes.`,q:"Which option best summarizes the story?",opts:["Beginning: A lion was walking through the jungle. Problem: The mouse got lost and couldn't find food. Solution: The lion gave food to the mouse. Lesson: Always be generous to those in need.","Beginning: A mouse accidentally disturbed a sleeping lion. Problem: The lion was caught in a hunter's net. Solution: The mouse chewed through the net and set the lion free. Lesson: Even the smallest creature can be a great help.","Beginning: The lion and mouse were best friends. Problem: The lion got hurt in a fight. Solution: The mouse helped him find water. Lesson: Friendship is built on adventure.","Beginning: A mouse was building a home near a tree. Problem: A storm destroyed the tree and trapped the lion. Solution: The mouse called for help from the jungle. Lesson: Teamwork solves big problems.","Beginning: A lion was hungry and searching for food. Problem: He couldn't catch any prey. Solution: The mouse helped him find food. Lesson: Hunger teaches humility."],ans:[1]},

{n:6,type:"MC",passage:`Effective Study Techniques

1. Know Your Learning Style — Understand whether you learn best by reading, listening, or watching.
2. Set a Consistent Study Schedule — Study at the same time every day. Regularity helps build strong habits.
3. Create a Comfortable Study Space — Find a quiet, well-lit, distraction-free area.
4. Use the Pomodoro Technique — Study for 25 minutes, then take a 5-minute break. This keeps your mind fresh and focused.
5. Take Effective Notes — Write key points using methods like mind maps or tables.
6. Practice and Repeat — Regularly review material and do practice questions.
7. Join a Study Group — Discuss topics with friends to gain insights and solve problems together.
8. Leverage Technology — Use apps and websites for flashcards, video lessons, or quizzes.
9. Get Enough Sleep — Aim for 7–8 hours.
10. Be Patient and Persistent — Learning takes time.`,q:"Based on the information given, we can keep our mind focused and fresh by ....",opts:["knowing your learning style","using Pomodoro Technique","using online quizzes apps","by reviewing materials","by creating mind maps"],ans:[1]},

{n:11,type:"MCMA",passage:`The Great Barrier Reef

The Great Barrier Reef is one of the most beautiful places in the world. It is located in the Pacific Ocean, near the northeast coast of Australia. The reef is very big. It stretches over 2,000 kilometers and can even be seen from space. There are many small coral islands and clear, warm waters around the reef.

This reef is full of life. There are many kinds of colorful fish, sea turtles, dolphins, and even sharks. Coral of different shapes and colors grows under the water. Sea birds fly over the reef and nest on small islands. People can see this beauty by swimming, diving, or joining a boat tour.

The colors under the water are amazing. Coral comes in red, yellow, green, and blue. Some coral looks like trees, and some looks like big round stones. Small fish swim in and out of the coral like they are playing a game. In some places, soft coral moves with the water like grass in the wind. When the sun shines, the reef looks bright and full of light. It feels like a different world under the sea.

The reef is not only beautiful, but also very important. It helps protect the coast from big waves and storms. It is a home for sea animals and a place where plants can grow. Many people also get food and jobs from the sea near the reef. Without the reef, the ocean would not be the same.`,q:"Which of the following descriptions are mentioned clearly in the text?",opts:["The reef was built by local communities over hundreds of years","The reef is located in the Pacific Ocean near Australia","The reef can help protect the coast from big waves","The reef is home to sea turtles and dolphins","The reef has more than 10,000 coral islands"],ans:[1,2,3]},

{n:16,type:"CAT",passage:`Why Teenagers Should Learn to Manage Their Money

Many young people today often spend money on things they like, such as snacks, clothes, or fun activities. But learning to handle money from a young age is very important. Good money habits can help students make a better future.

Students should think about short-term goals, like getting a new phone, and long-term goals, like saving for college or starting a business. A budget helps students decide how much money to save, spend, or keep for unexpected problems. Keeping track of spending with notes or apps helps students understand their habits. Saving is safer but slower, while investing has more risk but can earn more money.`,q:"Classify each statement according to the financial goal it represents.",rows:[["Saving money for university",["Long-term financial goals","Short-term financial goals"]],["Saving to buy a new phone",["Long-term financial goals","Short-term financial goals"]],["Starting a business",["Long-term financial goals","Short-term financial goals"]]],ans:["Long-term financial goals","Short-term financial goals","Long-term financial goals"]},

{n:21,type:"MC",passage:`The False Lion King

Once upon a time, in Africa, there lived two lion kings. One was named Hera and the other was Shero. Hera was very strong and handsome. All the animals loved and respected him. He was a great leader. Shero was not like Hera. He had a small mane and a funny, squeaky voice. Shero liked to pretend he was as powerful as Hera. He often copied Hera's roar, but it made the other animals laugh.

One day, the animals heard that some hyenas were causing trouble near the river. Hera quickly gathered his followers to stop the hyenas. Shero also wanted to come. He wanted to show everyone that he was strong too. When they reached the river, Hera roared loudly. His roar was so powerful that the hyenas got scared. Shero also tried to roar, but his voice was high and silly. The hyenas laughed at him.

Hera stayed calm and smiled. Shero did not give up. He said, "I am just as strong as Hera!" The hyenas laughed even louder. Shero tried to show his power by jumping on a small dirt hill. But he tripped and fell into the ground. The hyenas laughed so much they cried. Even Hera laughed a little.

At the end of the day, the hyenas left, still laughing about Shero. Hera told Shero, "You are not like me, but you make everyone happy with your jokes." Shero smiled and understood that he had his own special gift. From that day, Shero became the kingdom's jester. He and Hera ruled together, one with strength, and one with laughter. The animals learned that both power and fun are important in life.`,q:"Which statement provides the most accurate chronological summary of the story's main events?",opts:["Shero falls into the dirt. The hyenas cause trouble at the river. Hera tells Shero that he is funny. Shero copies Hera's roar. Shero becomes the kingdom's funny helper.","Hera is a strong lion king. Shero likes to pretend to be strong. The hyenas cause trouble near the river. Hera scares the hyenas, but Shero makes them laugh. Shero learns that making others happy is special.","Hera and Shero are both strong leaders. The hyenas come to help the lions. Shero tells funny stories to the hyenas. Hera is angry with Shero. The lions and hyenas become friends.","Shero is a strong lion king. Hera is jealous of Shero. The hyenas attack the lions. Shero defeats the hyenas. Shero becomes the new king.","Shero wants to be king and fights Hera. The hyenas help Shero. Hera leaves the kingdom. Shero becomes king. Hera returns to forgive Shero."],ans:[1]},

{n:26,type:"MC",passage:`Should Museums Use More Interactive Technology?

Recently, many museums have started using interactive technology to make their exhibitions more engaging. Some believe museums should use more technology because it can provide better learning experiences, especially for young visitors. Others argue that museums should not depend too heavily on technology because original objects remain important.

Interactive technology can make historical information more accessible. Visitors can examine the appearance of an object without touching it. They can also select topics or activities that encourage them to learn more. Rather than simply reading descriptions, visitors can explore the circumstances surrounding an ancient object or event.

However, technology should not replace original objects completely. Historical objects contain information that digital versions cannot always provide, such as their physical condition, size, and material. Museums need to determine an appropriate balance. The right choice may differ depending on the museum, the visitors, and the objects being displayed. In some circumstances, a simple explanation may be more effective.

Therefore, museums should use interactive technology as a supporting tool rather than a replacement for traditional displays. When used appropriately, it can strengthen visitors' learning experiences and encourage them to examine history more closely. Museums should select technology based on its educational purpose rather than simply because it is modern.`,q:"Which statement best summarizes the author's argument about the use of interactive technology in museums?",opts:["Museums should replace original objects with digital displays.","Museums should avoid using technology in historical exhibitions.","Museums should use technology appropriately to support traditional displays.","Museums should use technology mainly to attract young visitors.","Museums should allow visitors to choose all exhibition materials."],ans:[2]},

function makeCode(slot,dateValue){

  const base=slot==="A"?"1630":"1900";
  const date=String(dateValue||"").replace(/-/g,"");
  return `TKA26-${base}-${date}`;
}
function getSlot(){
  const now=new Date(); const mins=now.getHours()*60+now.getMinutes();
  if(mins>=16*60+30 && mins<18*60)return "A";
  if(mins>=19*60 && mins<21*60+30)return "B";
  return null;
}

async function validateAllTimePassword(password){
  const pass=String(password||"").trim();
  if(pass==="239204") return true;
  const url=CONFIG.GOOGLE_APPS_SCRIPT_URL;
  if(!url) return false;
  try{
    const r=await fetch(url+"?action=validateAccess&password="+encodeURIComponent(pass),{cache:"no-store"});
    const j=await r.json();
    return j && j.access === true;
  }catch(e){
    console.error("Validasi password gagal",e);
    return false;
  }
}

async function startExam(){
  const f=document.getElementById("bioForm"); if(!f)return;
  const data=Object.fromEntries(new FormData(f).entries());
  const required=[['name','Nama lengkap'],['email','Email'],['date','Tanggal'],['time','Jam mulai'],['class','Kelas'],['phone','Nomor WhatsApp'],['slot','Sesi']];
  const missing=required.filter(([k])=>!String(data[k]||'').trim());
  if(missing.length){alert('Lengkapi dulu: '+missing.map(x=>x[1]).join(', '));return;}
  if(!/^62\d{8,15}$/.test(String(data.phone).trim())){alert('Nomor WhatsApp harus menggunakan format 62xxxxxxxxxxx.');return;}
  const now=Date.now(), slot=data.slot;
  if(slot!=="A"&&slot!=="B"&&slot!=="ALL"){alert("Pilih sesi les terlebih dahulu.");return;}
  if(slot==="ALL"){
    const pass=String(data.allTimePassword||"").trim();
    if(!pass){alert("Masukkan password untuk membuka sesi All the time.");return;}
    const valid=await validateAllTimePassword(pass);
    if(!valid){alert("Password salah.");return;}
  }else{
    // Sesi reguler hanya dapat dimulai di dalam jam sesi yang dipilih.
    const nowDate=new Date(now);
    const hhmm=nowDate.getHours()*60+nowDate.getMinutes();
    const sessionStart=slot==="A"?(16*60+30):(19*60);
    const sessionEnd=slot==="A"?(18*60):(21*60+30);
    if(hhmm<sessionStart || hhmm>=sessionEnd){
      const label=slot==="A"?"16.30–18.00":"19.00–21.30";
      alert(`Sesi ${label} sedang CLOSED. Simulasi hanya dapat dimulai pada jam sesi tersebut.`);
      return;
    }
  }
  const end=slotEnd(slot); const available=slot==="ALL"?75*60:Math.max(0,Math.floor((end-now)/1000));
  if(available<=0){alert("Sesi les ini sudah berakhir.");return;}
  const duration=Math.min(75*60,available);
  current=1;
  state={status:"exam",attemptId:newAttemptId(),bio:data,code:makeCode(slot,data.date),start:now,deadline:now+duration*1000,duration,answers:{},flagged:{},violationCount:0,current:1};
  save();
  renderExam();
}
function beginFromSaved(){
  if(state?.status==="exam" && Date.now()<state.deadline){render();return}
  if(state?.status==="exam" && Date.now()>=state.deadline){finishExam(true);return}
  renderLogin();
}
function render(){
  if(!state){renderLogin();return}
  if(state.status==="exam"){if(Date.now()>=state.deadline){finishExam(true);return} renderExam();return}
  if(state.status==="done"){renderResult();return}
  renderLogin();
}

      sessionStatus.textContent=open?"OPEN":"CLOSED";

    }
    if(passField)passField.style.display=sel.value==="ALL"?"block":"none";
    if(selected!=="ALL" && document.getElementById("allTimePassword")) document.getElementById("allTimePassword").value="";
  };
  sel.onchange=syncCodeAndSession;
  if(dateInput) dateInput.addEventListener("change",syncCodeAndSession);
  syncCodeAndSession();

}
function normalizeTableAnswer(q, raw){
  const source=Array.isArray(raw)?raw:[];
  if(!Array.isArray(q?.rows)) return [];
  // IMPORTANT: table answers are stored by fixed row index.
  // Never read the DOM as the source of truth because section navigation
  // rebuilds the HTML and can otherwise make selected answers disappear.
  return q.rows.map((_,i)=>{
    const v=source[i];
    return v===undefined || v===null ? "" : String(v);
  });
}
function selectedAnswer(q){
  const raw=state?.answers?.[q.n];
  if(q.type==="CAT"||q.type==="TF"||q.type==="FACTOP") return normalizeTableAnswer(q,raw);
  return Array.isArray(raw) ? raw : [];
}
function answerMC(n,val){
  state.answers[n]=[Number(val)];
  save();
  syncExamUI();
}
function answerMCMA(n,val,checked){
  let a=Array.isArray(state.answers[n])?[...state.answers[n]]:[];
  const v=Number(val);
  a=checked?[...new Set([...a,v])]:a.filter(x=>x!==v);
  state.answers[n]=a.sort((a,b)=>a-b);
  save();
  syncExamUI();
}
function answerRow(n,row,val){
  if(!state||state.status!=="exam")return;
  const q=QUESTIONS.find(x=>x.n===n);
  if(!q || !Array.isArray(q.rows) || row<0 || row>=q.rows.length)return;
  // Store every table row in a permanent, fixed position.
  // This state is the ONLY source of truth, including after navigation,
  // rerendering, refresh, and submission.
  const a=normalizeTableAnswer(q,state.answers?.[n]);
  a[row]=String(val);
  state.answers[n]=a;
  save();
  // Update only the current question UI; do not rebuild the exam here.
  const qEl=document.getElementById("q"+n);
  if(qEl){
    qEl.querySelectorAll(`input[name="row${n}_${row}"]`).forEach(inp=>{
      const v=String(inp.getAttribute("data-value") ?? inp.value ?? "");
      const checked=v===String(val);
      inp.checked=checked;
      inp.closest("label")?.classList.toggle("selected",checked);
    });
  }
  syncExamUI();
}
function same(a,b){return JSON.stringify((a||[]).slice().sort())===JSON.stringify((b||[]).slice().sort())}
function isCorrect(q){
  const a=selectedAnswer(q);
  if(q.type==="CAT"||q.type==="TF"||q.type==="FACTOP") return JSON.stringify(a)===JSON.stringify(q.ans);
  return same(a,q.ans);
}
function isAnswered(q){
  if(q.type==="CAT"||q.type==="TF"||q.type==="FACTOP"){
    if(!Array.isArray(q.rows) || q.rows.length===0)return false;
    const a=selectedAnswer(q);
    // A table is complete only when EVERY row has a non-empty selection.
    return q.rows.every((_,i)=>String(a[i] ?? "").trim()!=="");
  }
  const a=selectedAnswer(q);
  return a.length>0;
}

function letters(vals){

function optionHtml(q){
  const a=selectedAnswer(q);
  return `<div class="options">`+
    q.opts.map((o,i)=>{
      const checked=q.type==="MC"?a?.[0]===i:(a||[]).includes(i);
      const type=q.type==="MC"?"radio":"checkbox";
      const handler=q.type==="MC"?`answerMC(${q.n},${i})`:`answerMCMA(${q.n},${i},this.checked)`;

      // Question 1 only: format Beginning / Problem / Solution / Lesson
      // as separate lines, with the labels emphasized. No other question is changed.
      if(q.n===1){
        const parts=o.split(/\s+(?=(?:Beginning|Problem|Solution|Lesson):)/);

        <input type="${type}" name="q${q.n}" ${checked?"checked":""} onclick="${handler}">

function updateTimer(){
  if(!state||state.status!=="exam")return;
  const sec=Math.max(0,Math.floor((state.deadline-Date.now())/1000));
  const el=document.getElementById("timer"); if(el)el.textContent=`${pad(Math.floor(sec/60))}:${pad(sec%60)}`;

function buildSubmission(){
  const finished=Date.now();
  const durationSeconds=Math.max(0,Math.min(Math.round((finished-state.start)/1000),Math.round(state.duration)));
  const detail=QUESTIONS.map(q=>({question:q.n,type:q.type,questionText:q.q,answer:state.answers[q.n]??"",correctAnswer:q.ans,correct:isCorrect(q),status:!isAnswered(q)?"Tidak terisi":isCorrect(q)?"Benar":"Salah"}));
  const correct=detail.filter(x=>x.correct).length;
  const blank=detail.filter(x=>x.status==="Tidak terisi").length;
  const wrong=TOTAL_QUESTIONS-correct-blank;
  return {finished,durationSeconds,detail,correct,wrong,blank,score:+(correct/TOTAL_QUESTIONS*100).toFixed(2)};
}
function finishExam(auto=false,reason){
  if(!state||state.status!=="exam")return;
  clearInterval(timerInterval);
  const sub=buildSubmission();
  state.status="done";state.finished=sub.finished;state.finishReason=reason||"Selesai manual";
  state.result={correct:sub.correct,wrong:sub.wrong,total:TOTAL_QUESTIONS,blank:sub.blank,score:sub.score,detail:sub.detail,violationCount:state.violationCount||0,durationSeconds:sub.durationSeconds};
  save();
  sendResultsToGoogle(true);
  renderResult(auto);
}

function pickThankMessage(score){
  const tier=score>=90?"high":score>=75?"upper":score>=60?"mid":"low";
  let used={};
  try{used=JSON.parse(localStorage.getItem(THANK_USED_KEY)||"{}");}catch(e){used={};}
  if(!Array.isArray(used[tier])) used[tier]=[];
  let available=THANK_MESSAGES[tier].map((_,i)=>i).filter(i=>!used[tier].includes(i));
  if(!available.length){used[tier]=[];available=THANK_MESSAGES[tier].map((_,i)=>i);}
  const index=available[Math.floor(Math.random()*available.length)];
  used[tier].push(index);
  try{localStorage.setItem(THANK_USED_KEY,JSON.stringify(used));}catch(e){}
  return THANK_MESSAGES[tier][index];
}
function renderThankYou(){
  if(!state||state.status!=="done")return;

  window.scrollTo({top:0,behavior:"smooth"});
}

rfokus pada siswa remaja, bukan\nbetween teenagers and adults perbandingan dengan orang dewasa.\nD ✗ SALAH A chart listing popular entertainment Daftar hiburan populer tidak secara\nchoices among students langsung menambah informasi tentang\npengelolaan uang.\nE ✗ SALAH A paragraph about students' experiences Bersifat naratif/pengalaman pribadi,\nin managing budget bukan data konkret pendukung.", "20": "NOMOR 20 Why Teenagers Should Learn to Manage Their Money\nIndikator: Menilai fakta/opini dalam analytical exposition text\nSoal: Which of the following statements are supported by clear data or facts in the text and table?\nKUNCI JAWABAN: A, B\nPembahasan per Opsi:\nStatus Bunyi Opsi Pembahasan\nA ✓ BENAR 45% of students save money regularly Merupakan data langsung dari Table 1:\n\"Students who save regularly 45%.\"\nB ✓ BENAR Tracking expenses can help understand Sesuai paragraf keempat teks tentang\nspending habits manfaat mencatat/melacak pengeluaran.\nC ✗ SALAH Most students do not care about money Bertentangan dengan data yang justru\nat all menunjukkan sebagian siswa sudah\nmenabung dan melacak pengeluaran.\nStatus Bunyi Opsi Pembahasan\nD ✗ SALAH Saving 10% of allowance is a good Ini penilaian/opini terhadap data, bukan\npractice fakta yang dinyatakan langsung dalam\nteks.\nE ✗ SALAH Spending on fun activities is always Ini opini yang bertentangan dengan\nbetter than saving keseluruhan pesan teks tentang\npentingnya menabung.", "21": "NOMOR 21 The False Lion King\nIndikator: Mengidentifikasi informasi penting procedure text\nSoal: Which statement provides the most accurate chronological summary of the story's main events?\nKUNCI JAWABAN: B\nPembahasan per Opsi:\nStatus Bunyi Opsi Pembahasan\nA ✗ SALAH Shero falls into the dirt. The hyenas Urutan kejadian pada opsi ini tidak sesuai\ncause trouble at the river. Hera tells alur asli cerita.\nShero that he is funny. Shero copies\nHera's roar. Shero becomes the\nkingdom's funny helper.\nB ✓ BENAR Hera is a strong edia.", "26": "Soal 26 — Ide pokok argumen penulis\nJawaban: C. Museums should use technology appropriately to support traditional displays.\nKesimpulan penulis ada di paragraf terakhir: “museums should use interactive technology as a supporting tool rather than a replacement for traditional displays.”\nA salah: penulis menolak teknologi menggantikan objek asli (“should not replace original objects completely”).\nB salah: penulis mendukung teknologi, hanya tidak berlebihan.\nD salah: pengunjung muda hanya disebut sebagai bagian dari pendapat pihak yang pro-teknologi, bukan argumen utama penulis.\nE salah: tidak ada pernyataan bahwa pengunjung memilih semua materi pameran. Teks hanya menyebut pengunjung bisa memilih topik atau aktivitas.", "27": "Soal 27 — TRUE / FALSE\n1 TRUE — Paragraf 2: “Visitors can examine the appearance of an object without touching it.”\n2 FALSE — Paragraf 3: “technology should not replace original objects completely.”\n3 TRUE — Paragraf 3: “The right choice may differ depending on the museum, the visitors, and the objects being displayed.”\n4 FALSE — Teks tidak menyatakan bahwa semua pengunjung muda menyukai aktivitas digital. Teks hanya menyebut sebagian orang percaya teknologi memberi pengalaman belajar lebih baik bagi pengunjung muda. Kata all membuat pernyataan ini terlalu absolut.", "28": "Soal 28 — Mengapa teknologi berguna untuk objek rapuh\nJawaban: A. It allows visitors to examine objects without physically touching the originals.\nTeks tidak menulis kata “fragile” secara langsung. Namun, kalimat “examine the appearance of an object without touching it” menjadi alasan teknologi berguna untuk objek rapuh, karena objek asli tidak perlu disentuh dan tetap terlindungi.\nB dan E salah: penulis justru menekankan bahwa objek asli tetap penting.\nC salah: pembelian objek tidak dibahas dalam teks.\nD salah: ukuran koleksi tidak dibahas dalam teks.", "29": "Soal 29 — FACT / OPINION\n1 FACT — Dapat dibuktikan dan sesuai teks: pengunjung dapat memeriksa tampilan objek secara digital.\n2 OPINION — Kata important adalah penilaian, bukan fakta yang dapat diukur. Di teks, ini juga merupakan pandangan pihak yang berargumen bahwa museum tidak boleh terlalu bergantung pada teknologi.\n3 OPINION — Kata should menandakan pendapat atau rekomendasi penulis.\n4 FACT — Teks menyatakan bahwa kondisi fisik, ukuran, dan material tidak selalu bisa disajikan versi digital. Ini klaim yang dapat diverifikasi.\nCatatan nomor 2: nomor ini paling berpotensi diperdebatkan karena sebagian siswa mungkin menganggapnya fakta. Kuncinya ada pada kata evaluatif important. Kata seperti should, important, best, dan better biasanya menandai opini.", "30": "Soal 30 — Informasi tambahan yang menguatkan argumen\nJawaban: A. A survey comparing visitors’ learning before and after interactive displays.\nArgumen penulis adalah bahwa teknologi interaktif mendukung pembelajaran di museum. Bukti terkuat adalah data yang langsung mengukur dampak teknologi terhadap pembelajaran, yaitu perbandingan sebelum dan sesudah adanya tampilan interaktif.\nB, C, D, dan E tidak berhubungan dengan pembelajaran pengunjung (daftar objek, renovasi, harga objek, dan waktu membeli suvenir)."};

function downloadResultPDF(){

  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, H=297, M=14, CW=W-(M*2);

  const C={
    navy:[18,51,74], teal:[30,159,163],
    blue:[27,103,169], blueBg:[238,247,255],
    red:[195,43,52], redBg:[255,241,243],
    green:[34,126,88], greenBg:[239,249,244],
    text:[43,58,70], muted:[100,115,125],
    border:[215,226,231], white:[255,255,255],
    soft:[246,249,250]
  };

  function pageHeader(){
    doc.setFillColor(...C.navy);
    doc.rect(0,0,W,25,"F");
    doc.setTextColor(...C.white);
    doc.setFont("helvetica","bold");
    doc.setFontSize(14.5);
    doc.text("TKA SMA 2026",M,10.5);
    doc.setFont("helvetica","normal");

  function pageFooter(){
    doc.setDrawColor(...C.border);
    doc.line(M,284,W-M,284);
    doc.setTextColor(...C.muted);
    doc.setFont("helvetica","normal");
    doc.setFontSize(7.2);
    doc.text("Design by Azzahra Kautsar Soud, S.Pd",M,290);
    doc.text("TKA SMA 2026",W-M,290,{align:"right"});
  }

  function newPage(){
    doc.addPage();
    pageHeader();
    return 33;
  }

  function cleanText(s){
    return String(s??"")
      .replace(/\r/g,"")
      .replace(/\u00a0/g," ")
      .replace(/[ \t]+/g," ")
      .replace(/ +\n/g,"\n")
      .replace(/\n +/g,"\n")
      .replace(/\n{3,}/g,"\n\n")
      .trim();
  }

  function answerText(v){
    if(Array.isArray(v)){
      return v.map(x=>typeof x==="number"?String.fromCharCode(65+x):String(x)).join(", ");
    }
    if(v===null||v===undefined||String(v)==="") return "Tidak terisi";
    return String(v);
  }

  function addQuestionCard(d, raw){
    let y=doc.lastAutoTable ? doc.lastAutoTable.finalY+9 : 34;
    if(y>255) y=newPage();

    doc.setFillColor(...C.redBg);
    doc.roundedRect(M,y,CW,18,2.5,2.5,"F");
    doc.setTextColor(...C.red);
    doc.setFont("helvetica","bold");
    doc.setFontSize(10.5);

    y+=23;
    doc.setFillColor(...C.navy);
    doc.roundedRect(M,y,CW,8,1.5,1.5,"F");

    doc.setFont("helvetica","bold");
    doc.setFontSize(8.5);
    doc.text("PEMBAHASAN",M+4,y+5.3);
    return y+11;
  }

  function addPlainRows(rows, y){
    if(!rows.length) return y;
    doc.autoTable({
      startY:y,
      body:rows.map(x=>[x]),
      theme:"plain",
      styles:{
        font:"helvetica",fontSize:8.2,textColor:C.text,
        cellPadding:{top:1.6,right:2,bottom:1.6,left:2},
        overflow:"linebreak",valign:"top"
      },
      margin:{left:M,right:M},
      tableWidth:CW
    });
    return doc.lastAutoTable.finalY;
  }

  function renderCategoryExplanation(raw,y){
    const t=cleanText(raw);
    const matches=[...t.matchAll(/(?:^|\n)(?:Item\s+)?(.+?)\s+(Self Management|Time Management)\s*(?=\n|$)/gi)];
    if(matches.length>=2){
      const rows=matches.map(m=>[m[1].replace(/^['"]|['"]$/g,"").trim(),m[2]]);
      doc.autoTable({
        startY:y,
        head:[["Study Technique","Category"]],
        body:rows,
        theme:"grid",
        styles:{
          font:"helvetica",fontSize:8,cellPadding:3,
          textColor:C.text,overflow:"linebreak",valign:"middle",
          lineColor:C.border,lineWidth:.25
        },
        headStyles:{fillColor:C.soft,textColor:C.navy,fontStyle:"bold"},
        columnStyles:{0:{cellWidth:105},1:{cellWidth:75,halign:"center",fontStyle:"bold"}},
        didParseCell:function(data){
          if(data.section==="body" && data.column.index===1){
            data.cell.styles.textColor=String(rows[data.row.index][1]).toLowerCase().includes("self")?C.blue:C.teal;
          }
        },
        margin:{left:M,right:M},
        tableWidth:CW
      });
      y=doc.lastAutoTable.finalY+4;

      const bullets=[
        "Be patient and persistent: Berkaitan dengan sikap mental/kesabaran, bukan pengaturan waktu — masuk Self Management.",
        "Use the Pomodoro technique: Mengatur durasi belajar dan istirahat — masuk Time Management.",
        "Set a consistent study schedule: Berkaitan langsung dengan penjadwalan waktu — masuk Time Management."
      ];
      return addPlainRows(bullets.map(x=>"• "+x),y);
    }
    return null;
  }

  function renderOptionTable(raw,y){
    let t=cleanText(raw);
    // Support both the original explanation format and the already-normalized format.
    const re=/(?:^|\n)\s*([A-E])\s*(?:[’'"]?\s*)?(✓|✗|BENAR|SALAH)\s*([\s\S]*?)(?=\n\s*[A-E]\s*(?:[’'"]?\s*)?(?:✓|✗|BENAR|SALAH)\s*|$)/gi;
    const matches=[...t.matchAll(re)];
    if(matches.length<2) return null;

    const rows=matches.map(m=>[
      m[1].toUpperCase(),
      /✓|BENAR/i.test(m[2])?"BENAR":"SALAH",
      cleanText(m[3]).replace(/^[:\-]\s*/,"")
    ]);

    doc.autoTable({
      startY:y,
      head:[["Opsi","Status","Pembahasan"]],
      body:rows,
      theme:"grid",
      styles:{
        font:"helvetica",fontSize:7.7,
        cellPadding:{top:2.8,right:3,bottom:2.8,left:3},
        textColor:C.text,overflow:"linebreak",valign:"top",
        lineColor:C.border,lineWidth:.25
      },
      headStyles:{fillColor:C.soft,textColor:C.navy,fontStyle:"bold"},
      columnStyles:{
        0:{cellWidth:12,halign:"center",fontStyle:"bold"},
        1:{cellWidth:22,halign:"center",fontStyle:"bold"},
        2:{cellWidth:CW-34}
      },
      didParseCell:function(data){
        if(data.section==="body"){
          const st=rows[data.row.index][1];
          data.cell.styles.fillColor=st==="SALAH"?C.redBg:C.blueBg;
          if(data.column.index===1) data.cell.styles.textColor=st==="SALAH"?C.red:C.blue;
        }
      },
      margin:{left:M,right:M},tableWidth:CW,
      rowPageBreak:"avoid"
    });
    return doc.lastAutoTable.finalY;
  }

  function renderGenericExplanation(raw,y){
    let t=cleanText(raw);

    // Remove duplicated metadata that should not appear inside the explanation body.
    t=t
      .replace(/^NOMOR\s+\d+[^\n]*\n?/i,"")
      .replace(/^Indikator:[^\n]*\n?/i,"")
      .replace(/^Soal:[^\n]*\n?/i,"")
      .replace(/^KUNCI JAWABAN:[^\n]*\n?/i,"")
      .replace(/^Pembahasan per Opsi:?/i,"")
      .replace(/^Pembahasan:?/i,"")
      .trim();

    // Category/table questions.
    const category=renderCategoryExplanation(t,y);
    if(category!==null) return category;

    // Try option table before generic text.
    const option=renderOptionTable(t,y);
    if(option!==null) return option;

    // Convert obvious bullets into clean bullet rows.
    const lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    const rows=[];
    for(let line of lines){
      line=line.replace(/^['"]|['"]$/g,"").trim();
      if(!line) continue;
      // Repair the old parser's artificial spacing.
      line=line.replace(/\s{2,}/g," ");
      line=line.replace(/\b([A-Z])\s{2,}/g,"$1 ");
      if(line.length>0) rows.push([line.startsWith("•")?line:"• "+line]);
    }

    if(!rows.length) rows.push(["Pembahasan tersedia pada materi simulasi."]);

    doc.autoTable({
      startY:y,
      body:rows,
      theme:"plain",
      styles:{
        font:"helvetica",fontSize:8.2,textColor:C.text,
        cellPadding:{top:1.8,right:2,bottom:1.8,left:2},
        overflow:"linebreak",valign:"top"
      },
      margin:{left:M,right:M},tableWidth:CW
    });
    return doc.lastAutoTable.finalY;
  }

  pageHeader();

  const r=state.result||{}, detail=Array.isArray(r.detail)?r.detail:[];
  const wrong=detail.filter(d=>d.status==="Salah");
  const name=String(state.bio?.name||"Siswa");

  doc.setTextColor(...C.navy);
  doc.setFont("helvetica","bold");
  doc.setFontSize(19);
  doc.text(name,M,37);

  doc.setFont("helvetica","normal");
  doc.setFontSize(8.5);
  doc.setTextColor(...C.muted);
  doc.text(`Kelas: ${state.bio?.class||"-"}   |   Sesi: ${slotLabel(state.bio?.slot)||"-"}`,M,44);
  doc.text(`Kode Tes: ${state.code||"-"}`,M,50);

  doc.autoTable({
    startY:57,
    head:[["Nilai","Benar","Salah","Tidak Terisi","Waktu","Pelanggaran"]],
    body:[[
      Number(r.score||0).toFixed(2)+" / 100",
      String(r.correct||0),String(r.wrong||0),String(r.blank||0),
      `${Math.floor(Number(r.durationSeconds||0)/60)} menit ${String(Number(r.durationSeconds||0)%60).padStart(2,"0")} detik`,
      String(r.violationCount||0)
    ]],
    theme:"grid",
    styles:{font:"helvetica",fontSize:8.2,cellPadding:3.5,textColor:C.text,lineColor:C.border,lineWidth:.25},
    headStyles:{fillColor:C.navy,textColor:C.white,fontStyle:"bold"},
    bodyStyles:{fillColor:C.soft,fontStyle:"bold"},
    columnStyles:{0:{cellWidth:30},1:{cellWidth:24},2:{cellWidth:24},3:{cellWidth:27},4:{cellWidth:38},5:{cellWidth:25}},
    margin:{left:M,right:M},tableWidth:CW
  });

  let y=doc.lastAutoTable.finalY+10;
  doc.setTextColor(...C.navy);
  doc.setFont("helvetica","bold");
  doc.setFontSize(12);
  doc.text("Ringkasan Jawaban",M,y);
  y+=4;

  const summaryRows=detail.map(d=>[
    String(d.question),d.questionText||"",answerText(d.answer),answerText(d.correctAnswer),d.status||"Tidak terisi"
  ]);

  doc.autoTable({
    startY:y,
    head:[["No.","Soal","Jawaban Siswa","Jawaban Benar","Status"]],
    body:summaryRows,
    theme:"grid",
    styles:{
      font:"helvetica",fontSize:7.2,
      cellPadding:{top:2.4,right:2.5,bottom:2.4,left:2.5},
      overflow:"linebreak",valign:"top",
      lineColor:C.border,lineWidth:.25,textColor:C.text
    },
    headStyles:{fillColor:C.soft,textColor:C.navy,fontStyle:"bold"},
    columnStyles:{0:{cellWidth:11,halign:"center"},1:{cellWidth:70},2:{cellWidth:34},3:{cellWidth:34},4:{cellWidth:33}},
    didParseCell:function(data){
      if(data.section==="body"){
        const st=summaryRows[data.row.index][4];
        if(st==="Salah") data.cell.styles.fillColor=C.redBg;
        else if(st==="Benar") data.cell.styles.fillColor=C.blueBg;
        if(data.column.index===2||data.column.index===4){
          data.cell.styles.fontStyle="bold";
          data.cell.styles.textColor=st==="Salah"?C.red:st==="Benar"?C.blue:C.muted;
        }
      }
    },
    margin:{left:M,right:M},tableWidth:CW,rowPageBreak:"avoid"
  });

  if(!wrong.length){
    y=doc.lastAutoTable.finalY+10;
    if(y>265)y=newPage();
    doc.setFillColor(...C.greenBg);
    doc.roundedRect(M,y,CW,17,2.5,2.5,"F");
    doc.setTextColor(...C.green);
    doc.setFont("helvetica","bold");
    doc.setFontSize(9);
    doc.text("Tidak ada jawaban salah pada simulasi ini.",M+5,y+10);
  }else{
    for(const d of wrong){
      y=addQuestionCard(d,EXPLANATIONS[d.question]||"");
      const raw=EXPLANATIONS[d.question]||"";
      y=renderGenericExplanation(raw,y);
      // Leave breathing room before the next question.
      doc.lastAutoTable.finalY=y;
    }
  }

  const pages=doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    pageFooter();
  }

  const safe=name.replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,"");
  doc.save(`TKA_SMA_2026_${safe||"Siswa"}_Hasil.pdf`);
}

async function sendResultsToGoogle(finalSubmission=false){
  const url=CONFIG.GOOGLE_APPS_SCRIPT_URL; if(!url||!state)return;
  const detail=(state.result?.detail)||QUESTIONS.map(q=>({question:q.n,type:q.type,questionText:q.q,answer:state.answers[q.n]??"",correctAnswer:q.ans,correct:isCorrect(q),status:!isAnswered(q)?"Tidak terisi":isCorrect(q)?"Benar":"Salah"}));
  const finishedAt=state.finished?new Date(state.finished).toISOString():null;
  const startAt=state.start?new Date(state.start).toISOString():null;
  const durationSeconds=state.result?.durationSeconds||Math.max(0,Math.round(((state.finished||Date.now())-state.start)/1000));
  const payload={action:finalSubmission?"submit":"autosave",name:state.bio.name,email:state.bio.email,phone:state.bio.phone||"",date:state.bio.date,time:state.bio.time,
    className:state.bio.class,slot:slotLabel(state.bio.slot),code:state.code,attemptId:state.attemptId||"",version:CONFIG.VERSION,mode:"STUDENT",
    startAt,finishedAt,durationSeconds,finishReason:state.finishReason||"",violations:state.violationCount||0,
    total:TOTAL_QUESTIONS,correct:state.result?.correct??detail.filter(x=>x.correct).length,wrong:state.result?.wrong??detail.filter(x=>x.status==="Salah").length,
    blank:state.result?.blank??detail.filter(x=>x.status==="Tidak terisi").length,score:state.result?.score??0,answers:detail};
  try{
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  }catch(e){console.warn("Google Apps Script submission failed",e)}
}
function saveCheckpoint(reason){
  if(!state||state.status!=="exam")return;
  state.finishReason=reason||state.finishReason||"Pelanggaran tab/aplikasi";
  save();
  sendResultsToGoogle(false);
}

let violationActive=false;
let violationStartedAt=0;
let violationTimer=null;
let awaySignalTimer=null;
let warningDialogActive=false;

/*
  ANTI-CHEAT RULES
  - One tab/app switch = one violation, even if both blur and visibilitychange fire.
  - Returning within 7 seconds = warning only.
  - Returning after 7 seconds = auto-submit and show result.
  - No freeze screen. The student is taken directly to the result page.
*/
function startViolationWindow(){
  // Anti-cheat is active ONLY after the student has successfully started the exam.
  // Registration/biodata pages are never counted as violations.
  // A native warning dialog can itself trigger blur/focus events on some phones,
  // so those events are explicitly ignored while the warning is open.
  if(!state || state.status!=="exam" || violationActive || warningDialogActive) return;

  violationActive=true;
  violationStartedAt=Date.now();
  state.violationCount=(Number(state.violationCount)||0)+1;
  state.violationStartedAt=violationStartedAt;
  save();

  const count=Number(state.violationCount||0);

  // The 3rd DISTINCT tab/app switch ends the attempt immediately.
  // The 7-second rule still applies to the first and second violations.
  if(count>=3){
    finishExam(true,"Pelanggaran ke-3 tab/aplikasi");
    return;
  }

  sendResultsToGoogle(false);

  const started=violationStartedAt;
  if(violationTimer) clearTimeout(violationTimer);
  violationTimer=setTimeout(()=>{
    if(!state || state.status!=="exam" || !violationActive) return;
    if(Number(state.violationStartedAt)!==started) return;

    const elapsed=Date.now()-started;
    if(elapsed>=7000){
      finishExam(true,"Pelanggaran tab/aplikasi > 7 detik");
    }
  },7100);
}

function handleReturnFromViolation(){
  if(!state || state.status!=="exam" || !violationActive || warningDialogActive) return;

  // Do not treat a focus event as a return while the document is still hidden.
  if(document.hidden) return;

  const started=Number(state.violationStartedAt||violationStartedAt||0);
  const elapsed=started ? Date.now()-started : 0;

  if(violationTimer){clearTimeout(violationTimer);violationTimer=null;}

  // Lock this episode BEFORE opening the warning. This is important on Android:
  // opening/dismissing alert() may generate blur/focus events of its own.
  violationActive=false;
  violationStartedAt=0;
  state.violationStartedAt=0;
  save();

  if(elapsed>=7000){
    finishExam(true,"Pelanggaran tab/aplikasi > 7 detik");
    return;
  }

  const count=Number(state.violationCount||0);
  const remaining=Math.max(1,Math.ceil((7000-elapsed)/1000));

  warningDialogActive=true;
  try{
    alert(`PERINGATAN ${count}/3
Kamu berpindah tab atau membuka aplikasi lain.
Kembali ke simulasi dalam batas 7 detik. Sisa toleransi: ${remaining} detik.
Jika melewati 7 detik, simulasi akan otomatis disubmit.`);
  }finally{
    warningDialogActive=false;
  }

  // Re-render from the saved state only after the warning is dismissed.
  renderExam();
}

// Visibility is the sole signal for tab/app switching.
// This prevents blur/focus and visibilitychange from counting the same switch twice.
document.addEventListener("visibilitychange",()=>{
  if(warningDialogActive) return;
  if(!state || state.status!=="exam") return;
  if(document.hidden){
    startViolationWindow();
  }else{
    handleReturnFromViolation();
  }
});

// Fallback for switching to another application when the browser does not
// change document.visibilityState. The delay lets visibilitychange win first,
// so one switch can never be counted twice.
let blurFallbackTimer=null;
window.addEventListener("blur",()=>{
  if(warningDialogActive) return;
  if(blurFallbackTimer) clearTimeout(blurFallbackTimer);
  blurFallbackTimer=setTimeout(()=>{
    blurFallbackTimer=null;
    if(!state || state.status!=="exam" || violationActive) return;
    if(document.hidden) return;
    startViolationWindow();
  },300);
});
window.addEventListener("focus",()=>{
  if(warningDialogActive) return;
  if(blurFallbackTimer){clearTimeout(blurFallbackTimer);blurFallbackTimer=null;}
  if(!document.hidden) handleReturnFromViolation();
});

window.addEventListener("beforeunload",()=>{save();});

window.addEventListener("load",()=>{
  try{
    if(state?.status==="exam"){
      // A refresh during an away episode must never reset the 7-second window.
      if(state.violationStartedAt){
        const away=Date.now()-Number(state.violationStartedAt);
        if(away>=7000){
          finishExam(true,"Pelanggaran tab/aplikasi > 7 detik");
          return;
        }
        // The episode has already been counted. Returning after a refresh does
        // not create a second violation for the same away episode. Preserve the
        // original timestamp so the 7-second rule cannot be bypassed.
        violationActive=true;
        violationStartedAt=Number(state.violationStartedAt);
        const remain=Math.max(0,7000-(Date.now()-violationStartedAt));
        if(remain<=0){ finishExam(true,"Pelanggaran tab/aplikasi > 7 detik"); return; }
        if(violationTimer) clearTimeout(violationTimer);
        violationTimer=setTimeout(()=>{
          if(state?.status==="exam" && violationActive && Date.now()-violationStartedAt>=7000) finishExam(true,"Pelanggaran tab/aplikasi > 7 detik");
        },remain+50);
        state.violationStartedAt=violationStartedAt;
        save();
        setTimeout(()=>handleReturnFromViolation(),0);
      }
      if(Date.now()>=state.deadline){
        finishExam(true,"Waktu habis");
        return;
      }
    }
    render();
  }catch(err){
    console.error("Initial render error",err);
    state=null; current=1;
    try{localStorage.removeItem(STORE);}catch(_){}
    renderLogin();
  }
});
