async function sendResultsToGoogle(finalSubmission=false){
  const url=CONFIG.GOOGLE_APPS_SCRIPT_URL; if(!url||!state)return;
  const detail=(state.result?.detail)||QUESTIONS.map(q=>({question:q.n,type:q.type,questionText:q.q,answer:state.answers[q.n]??"",correctAnswer:q.ans,correct:isCorrect(q),status:!isAnswered(q)?"Tidak terisi":isCorrect(q)?"Benar":"Salah"}));
  const finishedAt=state.finished?new Date(state.finished).toISOString():null;
  const startAt=state.start?new Date(state.start).toISOString():null;
  const durationSeconds=state.result?.durationSeconds||Math.max(0,Math.round(((state.finished||Date.now())-state.start)/1000));
  const payload={action:finalSubmission?"submit":"autosave",name:state.bio.name,birthdate:state.bio.birthdate||"",date:state.bio.date,time:state.bio.time,
    className:state.bio.class,packageName:state.bio.package==="2"?"Paket Simulasi 2":"Paket Simulasi 1",slot:slotLabel(state.bio.slot),code:state.code,attemptId:state.attemptId||"",version:CONFIG.VERSION,mode:"STUDENT",
    startAt,finishedAt,durationSeconds,finishReason:state.finishReason||"",violations:state.violationCount||0,
    total:TOTAL_QUESTIONS,correct:state.result?.correct??detail.filter(x=>x.correct).length,wrong:state.result?.wrong??detail.filter(x=>x.status==="Salah").length,
    blank:state.result?.blank??detail.filter(x=>x.status==="Tidak terisi").length,score:state.result?.score??0,answers:detail};
  try{
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  }catch(e){console.warn("Google Apps Script submission failed",e)}
}
function saveCheckpoint(reason){
  if(!state||state.status!=="exam")return;
  state.finishReason=reason||state.finishReason||"Pelanggaran tab/aplikasi";
  save();
  sendResultsToGoogle(false);
}

let violationActive=false;
let violationStartedAt=0;
let violationTimer=null;
let awaySignalTimer=null;
let warningDialogActive=false;
let violationConfirmed=false;

/*
  ANTI-CHEAT RULES
  - Leaving the exam for less than 7 seconds = no warning and no violation.
  - Leaving the exam for more than 7 seconds = 1 confirmed violation + warning.
  - The 3rd confirmed violation ends the attempt automatically.
  - One tab/app switch is treated as one episode, even if blur and visibilitychange fire.
*/
function startViolationWindow(){
  // Anti-cheat is active ONLY after the student has successfully started the exam.
  // Registration/biodata pages are never counted as violations.
  if(!state || state.status!=="exam" || violationActive || warningDialogActive) return;

  violationActive=true;
  violationConfirmed=false;
  violationStartedAt=Date.now();
  state.violationStartedAt=violationStartedAt;
  save();

  const started=violationStartedAt;
  if(violationTimer) clearTimeout(violationTimer);
  violationTimer=setTimeout(()=>{
    if(!state || state.status!=="exam" || !violationActive) return;
    if(Number(state.violationStartedAt)!==started) return;

    const elapsed=Date.now()-started;
    if(elapsed>=7000){
      confirmViolation();
    }
  },7100);
}

function confirmViolation(){
  if(!state || state.status!=="exam" || !violationActive || violationConfirmed) return;

  violationConfirmed=true;
  state.violationCount=(Number(state.violationCount)||0)+1;
  save();

  const count=Number(state.violationCount||0);

  // The 3rd confirmed violation ends the attempt automatically.
  if(count>=3){
    finishExam(true,"Pelanggaran ke-3 tab/aplikasi > 7 detik");
    return;
  }

  // Save the confirmed violation to the backend, but do not show anything
  // until the student returns to the exam page.
  sendResultsToGoogle(false);
}

function handleReturnFromViolation(){
  if(!state || state.status!=="exam" || !violationActive || warningDialogActive) return;

  // Do not treat a focus event as a return while the document is still hidden.
  if(document.hidden) return;

  const started=Number(state.violationStartedAt||violationStartedAt||0);
  const elapsed=started ? Date.now()-started : 0;

  if(violationTimer){clearTimeout(violationTimer);violationTimer=null;}

  // Less than 7 seconds: completely ignore the episode.
  if(elapsed<7000 && !violationConfirmed){
    violationActive=false;
    violationConfirmed=false;
    violationStartedAt=0;
    state.violationStartedAt=0;
    save();
    return;
  }

  // Mobile browsers may throttle timers while the page is hidden, so confirm
  // the violation here as a fallback when the student returns after 7 seconds.
  if(elapsed>=7000 && !violationConfirmed){
    confirmViolation();
    if(!state || state.status!=="exam") return;
  }

  // Lock this episode BEFORE opening the warning. This prevents the alert()
  // itself from generating another anti-cheat event on some phones.
  const count=Number(state.violationCount||0);
  violationActive=false;
  violationConfirmed=false;
  violationStartedAt=0;
  state.violationStartedAt=0;
  save();

  warningDialogActive=true;
  try{
    alert(`PERINGATAN ${count}/3
Kamu berada di luar halaman simulasi lebih dari 7 detik.
Ini tercatat sebagai pelanggaran ${count}/3.
Pelanggaran ke-3 akan mengakhiri simulasi secara otomatis.`);
  }finally{
    warningDialogActive=false;
  }

  renderExam();
}

// Visibility is the sole signal for tab/app switching.
// This prevents blur/focus and visibilitychange from counting the same switch twice.
document.addEventListener("visibilitychange",()=>{
  if(warningDialogActive) return;
  if(!state || state.status!=="exam") return;
  if(document.hidden){
    startViolationWindow();
  }else{
    handleReturnFromViolation();
  }
});

// Fallback for switching to another application when the browser does not
// change document.visibilityState. The delay lets visibilitychange win first,
// so one switch can never be counted twice.
let blurFallbackTimer=null;
window.addEventListener("blur",()=>{
  if(warningDialogActive) return;
  if(blurFallbackTimer) clearTimeout(blurFallbackTimer);
  blurFallbackTimer=setTimeout(()=>{
    blurFallbackTimer=null;
    if(!state || state.status!=="exam" || violationActive) return;
    if(document.hidden) return;
    startViolationWindow();
  },300);
});
window.addEventListener("focus",()=>{
  if(warningDialogActive) return;
  if(blurFallbackTimer){clearTimeout(blurFallbackTimer);blurFallbackTimer=null;}
  if(!document.hidden) handleReturnFromViolation();
});

window.addEventListener("beforeunload",()=>{save();});

window.addEventListener("load",()=>{
  try{
    if(state?.status==="exam"){
      // A refresh during an away episode must never reset the 7-second window.
      if(state.violationStartedAt){
        const away=Date.now()-Number(state.violationStartedAt);
        if(away>=7000){
          finishExam(true,"Pelanggaran tab/aplikasi > 7 detik");
          return;
        }
        // The episode has already been counted. Returning after a refresh does
        // not create a second violation for the same away episode. Preserve the
        // original timestamp so the 7-second rule cannot be bypassed.
        violationActive=true;
        violationStartedAt=Number(state.violationStartedAt);
        const remain=Math.max(0,7000-(Date.now()-violationStartedAt));
        if(remain<=0){ finishExam(true,"Pelanggaran tab/aplikasi > 7 detik"); return; }
        if(violationTimer) clearTimeout(violationTimer);
        violationTimer=setTimeout(()=>{
          if(state?.status==="exam" && violationActive && Date.now()-violationStartedAt>=7000) finishExam(true,"Pelanggaran tab/aplikasi > 7 detik");
        },remain+50);
        state.violationStartedAt=violationStartedAt;
        save();
        setTimeout(()=>handleReturnFromViolation(),0);
      }
      if(Date.now()>=state.deadline){
        finishExam(true,"Waktu habis");
        return;
      }
    }
    render();
  }catch(err){
    console.error("Initial render error",err);
    state=null; current=1;
    try{localStorage.removeItem(STORE);}catch(_){}
    renderLogin();
  }
});
